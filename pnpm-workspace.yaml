packages:
  - "apps/*"
  - "packages/*"
  # Not a code package: the exam profile and, from Phase 2, the bank shards.
  # A workspace only so the app can import it through its exports map (ADR 18).
  - "content"

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

# `pnpm audit` names the private `@palier/content` workspace by its directory, `content`,
# at 0.0.0, and so matches it against the unrelated npm package `content`. No package of
# that name is in the lockfile, so these two advisories cannot apply (progress.md D135).
# Every other advisory still fails the audit step in CI.
auditConfig:
  ignoreGhsas:
    - GHSA-x6wp-rfwh-hcx7
    - GHSA-5854-jvxx-2cg9

# Patched versions forced under dev-only parents that pin a vulnerable one (progress.md D155).
# None of these parents has a release that fixes it, so Dependabot cannot propose one. Each
# override is scoped to its parent, adds no package, and was checked against the API the
# parent calls. `extract-zip` (under `@lhci/cli`) has no patched release at all; its two
# alerts are dismissed as tolerable risk, since it runs only on CI's Lighthouse step.
overrides:
  # GHSA-ph9p-34f9-6g65, GHSA-52f5-9888-hmc6: `@lhci/cli` calls `tmp.fileSync`, `external-editor` `tmp.tmpNameSync`.
  "@lhci/cli>tmp": ^0.2.6
  "external-editor>tmp": ^0.2.6
  # GHSA-w5hq-g745-h8pq: `@lhci/cli` calls only `uuid.v4()`, unchanged in 11.
  "@lhci/cli>uuid": ^11.1.1
  # GHSA-q8mj-m7cp-5q26: through Stryker's `typed-rest-client`, a patch release.
  "typed-rest-client>qs": ^6.15.2
  # GHSA-67mh-4wv8-2f99: `drizzle-kit`'s deprecated `@esbuild-kit` loader pins 0.18; drizzle-kit itself uses 0.25.
  "@esbuild-kit/core-utils>esbuild": ^0.25.0
  # GHSA-8r5x-fm3f-whwj, GHSA-xw65-4hp5-5hc7: `eslint-plugin-boundaries` and `@boundaries/elements` pin 4.7.9; a patch release (D236).
  "eslint-plugin-boundaries>handlebars": 4.7.10
  "@boundaries/elements>handlebars": 4.7.10
  # GHSA-c475-qrg2-pj4r: `get-uri` caps it at ^5. 6.0's one break, separate transfer hosts off by default, touches no call it makes.
  "get-uri>basic-ftp": ^6.2.3
  # GHSA-hp3w-g68c-fv3c: `sprintf-js` has no patched release. Only argparse 1 pulls it in, and js-yaml 3 needs argparse only
  # for its CLI, which nothing runs; `@lhci/utils` calls the library's `safeLoad`. argparse 2 has no dependencies.
  "js-yaml@3>argparse": ^2.0.1
