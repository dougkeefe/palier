# The nightly lane from implementation-plan.md 6.5. Unbounded in time, and it
# opens an issue rather than blocking anyone, because nothing here gates a merge.
name: nightly

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

env:
  # Property tests run 10,000 cases here instead of the fast lane's 50.
  CI_LANE: nightly
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

permissions:
  contents: read
  issues: write

jobs:
  nightly:
    name: Full property runs and cross-browser E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - name: Full property runs
        run: pnpm run test

      - name: Integration
        run: pnpm run test:integration

      - run: pnpm --filter @palier/web exec playwright install --with-deps
      - name: E2E, every browser
        run: pnpm run test:e2e

      - name: Open an issue on failure
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Nightly lane failed on ${context.sha.slice(0, 7)}`,
              body: `The nightly lane failed. Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['nightly'],
            });

  live-smoke:
    # The nightly live smoke (Phase 4 CI gate, progress.md D112): one real key check, three set
    # drafts, five reviews and two writing assessments through the adapter, measuring the tokens
    # each costs and checking every configured model id is still listed. A fork, or a repository
    # without the secret, skips it and says so; a failed call or a missing model opens an issue.
    name: Live smoke against the OpenAI API
    runs-on: ubuntu-latest
    steps:
      - name: Skip without a smoke key
        id: gate
        env:
          OPENAI_SMOKE_KEY: ${{ secrets.OPENAI_SMOKE_KEY }}
        run: |
          if [ -z "$OPENAI_SMOKE_KEY" ]; then
            echo "::notice::OPENAI_SMOKE_KEY is not set, so no live call was made (docs/deploy.md)."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v7
      - if: steps.gate.outputs.run == 'true'
        uses: pnpm/action-setup@v6
      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.gate.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.gate.outputs.run == 'true'
        run: pnpm exec turbo run build --filter=@palier/web^...
      - name: Run the live smoke
        id: smoke
        if: steps.gate.outputs.run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_SMOKE_KEY }}
        # The output is captured first, so a failing run still closes the summary's code fence.
        run: |
          set +e
          out=$(pnpm --filter @palier/web live-smoke 2>&1)
          status=$?
          printf '## Live smoke\n```\n%s\n```\n' "$out" | tee -a "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Open an issue on failure
        if: failure()
        uses: actions/github-script@v8
        env:
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        with:
          script: |
            const cause = process.env.SMOKE_OUTCOME === 'failure'
              ? 'A live OpenAI call failed, or a configured model is no longer listed.'
              : 'The job failed before the smoke ran (checkout, install or build).';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Nightly live smoke failed on ${context.sha.slice(0, 7)}`,
              body: `${cause} Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['nightly'],
            });
