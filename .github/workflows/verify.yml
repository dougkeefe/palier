# The CI lanes from implementation-plan.md 6.5.
#
# The budgets are enforced as build failures rather than tracked as a metric,
# because "a slow test is a build failure rather than a slow creep" is the whole
# point (implementation-plan.md 7). Zero retries anywhere in fast or medium:
# everything in them is deterministic by construction, so a flake is a real bug
# and gets quarantined with an issue the same day (6.5, flake policy).
name: verify

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  fast:
    name: Fast lane (budget 90s)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Install and cache restore sit OUTSIDE the timed window. The budget
      # measures the gate a contributor actually runs, not GitHub's runner.
      - run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Restore Turborepo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      # `turbo build` IS inside the window, because `pnpm verify` pays for it
      # and so should the budget.
      - name: pnpm verify
        run: |
          set -o pipefail
          start=$SECONDS
          if ! timeout --kill-after=15s 90s pnpm run verify; then
            code=$?
            if [ "$code" -eq 124 ] || [ "$code" -eq 137 ]; then
              echo "::error::Fast lane exceeded its 90 second budget (implementation-plan.md 6.5). This is the baseline the project defends; make the suite faster rather than raising the number."
            fi
            exit "$code"
          fi
          echo "Fast lane: $((SECONDS - start))s of the 90s budget." >> "$GITHUB_STEP_SUMMARY"

  medium:
    name: Medium lane (budget 4m)
    runs-on: ubuntu-latest
    needs: fast
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      # Browser download sits OUTSIDE the timed window: it is ~150 MB of
      # network, not test time.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm --filter @palier/web exec playwright install --with-deps chromium

      - name: pnpm verify:medium (budget 4m)
        run: |
          set -o pipefail
          start=$SECONDS
          if ! timeout --kill-after=30s 240s pnpm run verify:medium; then
            code=$?
            if [ "$code" -eq 124 ] || [ "$code" -eq 137 ]; then
              echo "::error::Medium lane exceeded its 4 minute budget (implementation-plan.md 6.5)."
            fi
            exit "$code"
          fi
          echo "Medium lane: $((SECONDS - start))s of the 240s budget." >> "$GITHUB_STEP_SUMMARY"

      # Bundle-size and Lighthouse budgets (architecture.md §13). Both read the
      # production build produced above; both fail the lane on a breach.
      - name: Bundle-size budget (< 180 KB gzipped first-load JS)
        run: pnpm --filter @palier/web bundle-size

      - name: Lighthouse budget (performance and accessibility >= 95)
        run: pnpm --filter @palier/web lighthouse
