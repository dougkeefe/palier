# The CI lanes from implementation-plan.md 6.5.
#
# The budgets are enforced as build failures rather than tracked as a metric,
# because "a slow test is a build failure rather than a slow creep" is the whole
# point (implementation-plan.md 7). Zero retries anywhere in fast or medium:
# everything in them is deterministic by construction, so a flake is a real bug
# and gets quarantined with an issue the same day (6.5, flake policy).
name: verify

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  fast:
    name: Fast lane (budget 120s)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Install and cache restore sit OUTSIDE the timed window. The budget
      # measures the gate a contributor actually runs, not GitHub's runner.
      - run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      # The lockfile audit gate (architecture.md §6.4, §12): a compromised client
      # dependency is the other realistic path to the user's key. Production
      # dependencies only, since dev tooling never ships (progress.md D135), and
      # outside the timed window, because it is a network call to the registry.
      - name: Dependency audit
        run: pnpm audit --prod --audit-level=high

      # Both caches are restored here and saved below even when the lane fails.
      # `actions/cache` alone saves only after a green job, so a lane over its
      # budget could never warm the cache that would bring it back under
      # (progress.md D178).
      - name: Restore Turborepo cache
        uses: actions/cache/restore@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      # ESLint's own cache. Keyed on content, not mtime, because a checkout
      # stamps every file fresh. No rule is type-aware (eslint.config.mjs), so a
      # file's result depends only on its own text and the config, and a config
      # or ESLint change empties it.
      - name: Restore ESLint cache
        uses: actions/cache/restore@v6
        with:
          path: .eslintcache
          key: eslint-${{ runner.os }}-${{ github.sha }}
          restore-keys: eslint-${{ runner.os }}-

      # `turbo build` IS inside the window, because `pnpm verify` pays for it
      # and so should the budget. The script fails the step on a failing gate
      # or a blown budget alike, and stamps each phase into the summary (D177).
      - name: pnpm verify
        run: .github/scripts/within-budget.sh 120 "Fast lane" pnpm run verify

      - name: Save Turborepo cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}

      - name: Save ESLint cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .eslintcache
          key: eslint-${{ runner.os }}-${{ github.sha }}

  # The medium lane is three jobs in parallel, each held to the 5 minute budget
  # on its own wall clock (progress.md D178): the integration projects, and the
  # E2E suite in two Playwright shards. `pnpm verify:medium` runs all of it in
  # one process locally. The job names are required status checks on `main`
  # (docs/deploy.md), so renaming one breaks branch protection.
  medium-integration:
    name: "Medium lane: integration (budget 5m)"
    runs-on: ubuntu-latest
    needs: fast
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - run: pnpm run build

      - name: Integration (budget 5m)
        run: .github/scripts/within-budget.sh 300 "Medium lane, integration" pnpm run test:integration

      # Bundle-size and Lighthouse budgets (architecture.md §13). Both read the
      # production build produced above; both fail the lane on a breach.
      # Lighthouse drives the runner's own Chrome, not Playwright's.
      - name: Bundle-size budget (< 180 KB gzipped first-load JS)
        run: pnpm --filter @palier/web bundle-size

      - name: Lighthouse budget (performance and accessibility >= 95)
        run: pnpm --filter @palier/web lighthouse

  medium-e2e:
    name: "Medium lane: E2E ${{ matrix.shard }}/2 (budget 5m)"
    runs-on: ubuntu-latest
    needs: fast
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The `offline` project drives `next start` over this build.
      - run: pnpm run build

      # Browser download sits OUTSIDE the timed window: it is ~150 MB of
      # network, not test time.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm --filter @palier/web exec playwright install --with-deps chromium

      - name: E2E shard ${{ matrix.shard }}/2 (budget 5m)
        run: >-
          .github/scripts/within-budget.sh 300 "Medium lane, E2E ${{ matrix.shard }}/2"
          pnpm run test:e2e --shard=${{ matrix.shard }}/2

      # A failed test's trace and error context, so a failure can be read rather than
      # re-run (progress.md D196). Nothing is uploaded when every test passes.
      - name: Upload the failed tests' traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failures-shard-${{ matrix.shard }}
          path: apps/web/test-results/
          retention-days: 14
