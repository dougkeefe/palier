<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--color-bg)}</style></head><body><div style="display:flex;gap:12px"><div style="flex:1;min-width:90px"><div style="height:64px;border-radius:var(--radius-sm);background:var(--color-bg);box-shadow:inset 0 0 0 1px #d8d6d5"></div><div style="font-size:12px;margin-top:6px;line-height:1.3">Paper<br><span style="color:var(--color-neutral-700)">--color-bg</span></div></div><div style="flex:1;min-width:90px"><div style="height:64px;border-radius:var(--radius-sm);background:var(--color-text);"></div><div style="font-size:12px;margin-top:6px;line-height:1.3">Ink<br><span style="color:var(--color-neutral-700)">--color-text</span></div></div><div style="flex:1;min-width:90px"><div style="height:64px;border-radius:var(--radius-sm);background:var(--color-accent);"></div><div style="font-size:12px;margin-top:6px;line-height:1.3">Accent<br><span style="color:var(--color-neutral-700)">--color-accent</span></div></div><div style="flex:1;min-width:90px"><div style="height:64px;border-radius:var(--radius-sm);background:var(--color-accent-2-700);"></div><div style="font-size:12px;margin-top:6px;line-height:1.3">Kicker magenta<br><span style="color:var(--color-neutral-700)">--color-accent-2-700</span></div></div><div style="flex:1;min-width:90px"><div style="height:64px;border-radius:var(--radius-sm);background:var(--color-white);box-shadow:inset 0 0 0 1px #d8d6d5"></div><div style="font-size:12px;margin-top:6px;line-height:1.3">White<br><span style="color:var(--color-neutral-700)">--color-white</span></div></div></div></body></html>
