<!-- @dsCard group="Colors" viewport="700x170" subtitle="Navy scrims and glass fills used over photographs" name="Photo overlays and glass" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--color-bg)}</style></head><body><div style="display:flex;gap:12px;height:110px"><div style="flex:1;border-radius:12px;background:var(--overlay-hero),#7aa;color:#fff;padding:12px;font-size:12px">--overlay-hero</div><div style="flex:1;border-radius:12px;background:var(--overlay-banner),#7aa;color:#fff;padding:12px;font-size:12px">--overlay-banner</div><div style="flex:1;border-radius:12px;background:var(--overlay-card),#7aa;color:#fff;padding:12px;font-size:12px">--overlay-card</div><div style="flex:1;border-radius:12px;background:#7aa;display:grid;place-items:center"><span style="padding:7px 14px;border-radius:999px;background:var(--glass-fill);backdrop-filter:blur(8px);color:#fff;font-size:13px">--glass-fill</span></div></div></body></html>
